<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No page-level zoom: this page is embedded in the app's WebView, and a
         diagram takes taps, never a pinch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Interactive diagrams with Bengali labels." />

    <!-- The real title comes from the descriptor, once it has loaded. -->
    <title>GeoQuest</title>

    <!-- No icon, and no request for one: a browser would otherwise ask the
         host's root for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css?v=a9f63c2250" />
    <link rel="preload" href="../shared/fonts/noto-sans-bengali/NotoSansBengali-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- app.js imports it: asked for beside app.js, not after it. -->
    <link rel="modulepreload" href="../shared/resolver.js?v=a9f63c2250" />
  </head>

  <body>
    <main class="visual-page">
      <!-- No visible heading: the app's viewer shows the diagram's title above
           this page. The heading stays for screen readers, filled from the
           descriptor, and hidden while the descriptor has no Bengali title. -->
      <h1 id="pageTitle" class="visually-hidden" lang="bn" hidden></h1>

      <header class="visual-header">
        <!-- One tab per view the descriptor declares. -->
        <div id="viewTabs" class="view-tabs" role="tablist" hidden></div>

        <!-- The credits, as the map shell's compact ⓘ: collapsed until tapped. -->
        <div id="attrib" class="attrib" hidden>
          <button id="attribButton" type="button" class="attrib-button" aria-label="Toggle attribution" aria-expanded="false" aria-controls="attribInner">
            <svg viewBox="0 0 20 20" width="24" height="24" aria-hidden="true" focusable="false">
              <path fill-rule="evenodd" d="M4 10a6 6 0 1 0 12 0 6 6 0 1 0-12 0m5-3a1 1 0 1 0 2 0 1 1 0 1 0-2 0m0 3a1 1 0 1 1 2 0v3a1 1 0 1 1-2 0" />
            </svg>
          </button>
          <p id="attribInner" class="attrib-inner" hidden></p>
        </div>
      </header>

      <!-- Each view's panel; a view's own module fills it. -->
      <div id="panels" class="panels"></div>

      <!-- Shown when the diagram cannot be loaded. These are the page's own
           copy of the descriptor's words, for a descriptor that never
           arrives; once it has, its words replace them. -->
      <div id="loadNotice" class="load-notice" role="alert" lang="bn" hidden>
        <strong id="loadNoticeHeadline">ডায়াগ্রামটি লোড করা যায়নি।</strong>
        <span id="loadNoticeAdvice">ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</span>
      </div>
    </main>

    <script type="module" src="./app.js?v=a9f63c2250"></script>
  </body>
</html>
