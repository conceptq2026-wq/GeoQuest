<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive maps for the BCS Preliminary exam, grouped by subject." />
    <title>BCS Maps</title>
    <!--
      The hub: the one URL the app's CMS points at. Static, no requests beyond
      this file. Every link is relative to this page, so the folder can be
      served from any host, at the domain root or under a subpath.
      Light palette, same colours as the maps.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #eef3f8;
        color: #13233a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
        line-height: 1.45;
        overscroll-behavior: none;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px 16px 32px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        line-height: 1.25;
      }
      .intro {
        margin: 0 0 8px;
        color: #4f5d6e;
        font-size: 14px;
      }
      section {
        margin-top: 24px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 18px;
        line-height: 1.3;
      }
      /* The BCS subject name, as the syllabus writes it. Allowed to wrap. */
      h2 [lang='bn'] {
        display: block;
        margin-top: 2px;
        color: #4f5d6e;
        font-size: 14px;
        font-weight: 500;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li + li {
        margin-top: 10px;
      }
      /* The whole card is the link: one big tap target, no hover-only cues. */
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 12px 14px 12px 16px;
        border: 1px solid #c9d6e3;
        border-radius: 14px;
        background: #ffffff;
        color: #13233a;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      .card:active {
        background: #f2f6fa;
      }
      .card:focus-visible {
        outline: 2px solid #0b5cad;
        outline-offset: 2px;
      }
      .card-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .card-title {
        display: block;
        font-size: 16px;
        font-weight: 650;
      }
      .card-desc {
        display: block;
        margin-top: 2px;
        color: #5b6878;
        font-size: 13px;
      }
      .card-arrow {
        flex: 0 0 auto;
        color: #0b5cad;
        font-size: 22px;
        line-height: 1;
      }
      .soon {
        margin: 0;
        padding: 14px 16px;
        border: 1px dashed #c9d6e3;
        border-radius: 14px;
        color: #5b6878;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BCS Maps</h1>
      <p class="intro">Interactive maps for the BCS Preliminary exam, by subject.</p>
      <div id="sections"></div>
      <p id="failure" class="soon" hidden>The map list could not be loaded. Reload the page.</p>
    </main>

    <script>
      /*
       * The list is GENERATED. tools/build-registry.mjs writes registry.json
       * from every descriptor under maps/, and this page renders whatever it
       * finds — so adding a map is one action, writing its descriptor, and a
       * map can never be missing from a list nobody remembered to edit.
       *
       * Every URL here is relative and spells out index.html: the production
       * host does not resolve directory indexes, and a bare directory link is
       * the kind of failure that only shows up after migration.
       */
      const SECTION_NAMES = {
        bangladesh: { en: 'Bangladesh', bn: 'বাংলাদেশ বিষয়াবলি' },
        international: { en: 'International', bn: 'আন্তর্জাতিক বিষয়াবলি' },
        geography: { en: 'Geography', bn: 'ভূগোল, পরিবেশ ও দুর্যোগ ব্যবস্থাপনা' },
      };

      const el = (tag, props = {}, kids = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const kid of kids) node.append(kid);
        return node;
      };

      function render(registry) {
        const root = document.getElementById('sections');
        // Section ORDER comes from the registry, which takes it from the
        // syllabus. Not sorted here, and not sorted there.
        for (const section of registry.sections) {
          const names = SECTION_NAMES[section] ?? { en: section, bn: '' };
          const heading = el('h2', { id: section }, [names.en + ' ']);
          if (names.bn) heading.append(el('span', { lang: 'bn', textContent: names.bn }));

          const maps = registry.maps.filter((m) => m.section === section);
          const body = maps.length
            ? el(
                'ul',
                {},
                maps.map((m) =>
                  el('li', {}, [
                    el('a', { className: 'card', href: 'shell/index.html?map=' + encodeURIComponent(m.id) }, [
                      el('span', { className: 'card-text' }, [
                        el('span', { className: 'card-title', textContent: m.title.en }),
                        el('span', { className: 'card-desc', lang: 'bn', textContent: m.title.bn }),
                      ]),
                      el('span', { className: 'card-arrow', ariaHidden: 'true', textContent: '›' }),
                    ]),
                  ]),
                ),
              )
            : // An empty section still renders: the three-subject structure is
              // the point, and a missing heading would read as a missing subject.
              el('p', { className: 'soon', textContent: 'Coming soon' });

          root.append(el('section', { ariaLabelledby: section }, [heading, body]));
        }
      }

      fetch('./registry.json')
        .then((r) => {
          if (!r.ok) throw new Error('registry.json: HTTP ' + r.status);
          return r.json();
        })
        .then(render)
        .catch((error) => {
          console.error(error);
          document.getElementById('failure').hidden = false;
        });
    </script>
  </body>
</html>
