<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No page-level zoom: this page is embedded in the app's WebView, and a
         pinch must zoom the map (MapLibre), never the whole page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Interactive map of the world's strategic straits and canals, with Bengali place names." />

    <title>Straits and Canals · GeoQuest</title>

    <!-- Everything is served from this repo: no CDN, no tile server, no API key. -->
    <link rel="stylesheet" href="../shared/vendor/maplibre-gl-6.9.0/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preload" href="../shared/fonts/noto-sans-bengali/NotoSansBengali-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <section class="strait-explorer">
      <!-- No visible heading: the map is only ever opened from a card that
           already names it, and the app's viewer shows that title right above
           this page. The heading stays for screen readers. -->
      <header class="explorer-header">
        <h1 class="visually-hidden" lang="bn">গুরুত্বপূর্ণ প্রণালি ও খাল</h1>
        <select id="straitSelector" class="strait-selector" aria-label="Choose a strait or canal" lang="bn">
          <option value="" disabled selected>একটি প্রণালি বা খাল বেছে নিন…</option>
          <optgroup label="প্রণালি" data-kind="strait"></optgroup>
          <optgroup label="খাল" data-kind="canal"></optgroup>
        </select>
      </header>

      <div class="map-shell">
        <div id="map"></div>

        <div id="loadNotice" class="load-notice" role="alert">
          <strong>Map data could not be loaded</strong>
          <span>Check the connection and reload the page. The straits, canals and shipping lanes still work.</span>
        </div>

        <!-- Bottom sheet over the map. Drag it down (or tap the handle) to leave
             only the handle; drag or tap the handle to bring it back. -->
        <aside id="infoSheet" class="info-sheet" aria-labelledby="infoTitle">
          <button id="sheetHandle" type="button" class="sheet-handle" aria-controls="infoSheetBody" aria-expanded="true" aria-label="Hide details">
            <span class="sheet-grip"></span>
          </button>
          <div id="infoSheetBody" class="info-sheet-body" aria-live="polite">
            <!-- The card is Bengali content throughout, labels included. -->
            <span id="infoKicker" class="info-kicker" lang="bn"></span>
            <h2 id="infoTitle" class="info-title" lang="bn"></h2>

            <div class="info-row">
              <span class="info-label" lang="bn">দেশ</span>
              <span id="infoCountries" class="info-value" lang="bn"></span>
            </div>
            <div class="info-row">
              <span class="info-label" lang="bn">সংযোগ</span>
              <span id="infoConnects" class="info-value" lang="bn"></span>
            </div>
            <!-- A row whose value is missing is hidden, never filled with a guess. -->
            <div class="info-row" id="rowBoundary">
              <span class="info-label" lang="bn">সীমানা</span>
              <span id="infoBoundary" class="info-value" lang="bn"></span>
            </div>
            <div class="info-row" id="rowOpened">
              <span class="info-label" lang="bn">চালু</span>
              <span id="infoOpened" class="info-value" lang="bn"></span>
            </div>
            <div class="info-row" id="rowLength">
              <span class="info-label" lang="bn">দৈর্ঘ্য</span>
              <span id="infoLength" class="info-value" lang="bn"></span>
            </div>
            <div class="info-row">
              <span class="info-label" lang="bn">নৌপথ</span>
              <span id="infoRoute" class="info-value" lang="bn"></span>
            </div>
          </div>
        </aside>

        <div class="layers-control">
          <button id="layersToggleBtn" type="button" class="layers-toggle-btn" aria-expanded="false" aria-controls="layersMenu">
            Layers ▾
          </button>
          <div id="layersMenu" class="layers-menu">
            <label class="layers-menu-item">
              <input type="checkbox" data-layer-group="countryLabels" checked />
              <span class="legend-swatch" style="background: #3f4650"></span>
              Country names
            </label>
            <label class="layers-menu-item">
              <input type="checkbox" data-layer-group="seas" checked />
              <span class="legend-swatch" style="background: #1f5f99"></span>
              Connected seas
            </label>
            <label class="layers-menu-item">
              <input type="checkbox" data-layer-group="routes" checked />
              <span class="legend-swatch" style="background: #e8590c"></span>
              Shipping routes
            </label>
          </div>
        </div>
      </div>
    </section>

    <!-- pmtiles reads the map data with HTTP range requests; loaded first so app.js can use it. -->
    <script src="../shared/vendor/pmtiles-4.5.0/pmtiles.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
