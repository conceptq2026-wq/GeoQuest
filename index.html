<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoQuest Maps</title>
    <style>
      @font-face {
        font-family: 'Noto Sans Bengali';
        src: url('./shared/fonts/noto-sans-bengali/NotoSansBengali-Regular.woff2') format('woff2');
        font-display: swap;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #07121d;
        color: #fff;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
      }
      p {
        color: rgba(255, 255, 255, 0.65);
      }
      ul {
        padding: 0;
        list-style: none;
      }
      a {
        display: block;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: #102334;
        color: #fff;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #183348;
      }
      [lang='bn'] {
        display: block;
        margin-top: 2px;
        color: rgba(255, 255, 255, 0.7);
        font-family: 'Noto Sans Bengali', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GeoQuest Maps</h1>
      <p>Interactive maps for BCS preparation. Each map has its own address, used by the Geo Quest screen in the Preli Quest app.</p>
      <ul>
        <li>
          <a href="./straits/">
            Strategic Straits
            <span lang="bn">গুরুত্বপূর্ণ প্রণালি</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
